services:
  - type: web
    name: medisync-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    autoDeployTrigger: commit
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm exec prisma generate && corepack pnpm run build
    startCommand: corepack pnpm exec prisma db push && corepack pnpm exec prisma db seed && corepack pnpm start
    healthCheckPath: /api/ia/prompts
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medisync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
